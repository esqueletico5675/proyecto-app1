<!-- Modal Crear Usuario -->
<div class="modal fade" id="modalCrearUsuario" tabindex="-1" aria-labelledby="modalUsuarioLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="modalUsuarioLabel">Crear Usuario</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <form method="POST" action="/form/crear-usuario" enctype="multipart/form-data" novalidate>
        <div class="modal-body">
          <div class="mb-3">
            <label class="form-label">Nombre</label>
            <input type="text" class="form-control" name="name"
                   placeholder="Ej: pepe"
                   minlength="1" maxlength="15"
                   pattern="[A-Za-záéíóúÁÉÍÓÚñÑ\s]+"
                   title="Solo letras, máximo 15 caracteres"
                   required>
            <div class="invalid-feedback">Nombre requerido, solo letras y máximo 15 caracteres.</div>
          </div>
          <div class="mb-3">
            <label class="form-label">PIN</label>
            <input type="password" class="form-control" name="pin"
                   placeholder="Ej: 1234"
                   minlength="4" maxlength="6"
                   pattern="\d{4,6}"
                   title="PIN de 4 a 6 dígitos numéricos"
                   required>
            <div class="invalid-feedback">PIN debe ser de 4 a 6 dígitos numéricos.</div>
          </div>
          <div class="mb-3">
            <label class="form-label">Foto de perfil (opcional)</label>
            <input type="file" class="form-control" name="imagen" accept="image/*">
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="submit" class="btn btn-primary">Guardar</button>
        </div>
      </form>
    </div>
  </div>
</div>

<!-- Modal Crear Post -->
<div class="modal fade" id="modalCrearPost" tabindex="-1" aria-labelledby="modalPostLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="modalPostLabel">Crear Post</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <form method="POST" action="/form/crear-post" enctype="multipart/form-data" novalidate>
        <div class="modal-body">
          <div class="mb-3">
            <label class="form-label">ID de Usuario</label>
            <input type="number" class="form-control" name="user_id"
                   placeholder="Ej: 1" min="1" required>
            <div class="invalid-feedback">Ingresa un ID de usuario válido.</div>
          </div>
          <div class="mb-3">
            <label class="form-label">Contenido</label>
            <textarea class="form-control" name="contenido" rows="3"
                      placeholder="Escribe tu post..."
                      minlength="5" maxlength="500"
                      required></textarea>
            <div class="invalid-feedback">El contenido debe tener entre 5 y 500 caracteres.</div>
          </div>
          <div class="mb-3">
            <label class="form-label">Imagen (opcional)</label>
            <input type="file" class="form-control" name="imagen" accept="image/*">
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="submit" class="btn btn-primary">Publicar</button>
        </div>
      </form>
    </div>
  </div>
</div>
