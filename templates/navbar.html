<!-- Modal Crear Usuario -->
<div class="modal fade" id="modalCrearUsuario" tabindex="-1" aria-labelledby="modalUsuarioLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="modalUsuarioLabel">Crear Usuario</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <form method="POST" action="/form/crear-usuario">
        <div class="modal-body">
          <div class="mb-3">
            <label class="form-label">Nombre</label>
            <input type="text" class="form-control" name="name" placeholder="Ej: pepe" required>
          </div>
          <div class="mb-3">
              <label class="form-label">PIN (para editar o borrar después)</label>
              <input type="password" class="form-control" name="pin" placeholder="Ej: 1234" required>
        </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="submit" class="btn btn-primary">Guardar</button>
        </div>
      </form>
    </div>
  </div>

<!-- Modal Crear Post -->
<div class="modal fade" id="modalCrearPost" tabindex="-1" aria-labelledby="modalPostLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="modalPostLabel">Crear Post</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <form method="POST" action="/form/crear-post">
        <div class="modal-body">
          <div class="mb-3">
            <label class="form-label">ID de Usuario</label>
            <input type="number" class="form-control" name="user_id" placeholder="Ej: 1" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Contenido</label>
            <textarea class="form-control" name="contenido" rows="3" placeholder="Escribe tu post..." required></textarea>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="submit" class="btn btn-primary">Publicar</button>
        </div>
      </form>
    </div>
  </div>
