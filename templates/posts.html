{% extends "base.html" %}

{% block contenido %}
<h1 class="mb-4">Posts</h1>

{% if word %}
    <p class="text-muted">Resultados para: <strong>{{ word }}</strong></p>
{% endif %}

{% if posts %}
    <div class="row">
        {% for post in posts %}
            {% include "post_card.html" %}
        {% endfor %}
    </div>
{% else %}
    <p class="text-muted">No hay posts todavía.</p>
{% endif %}

{% endblock %}
