<div class="col-12 col-md-6 mb-4">
    <div class="card h-100 shadow-sm">

        {% if post.image_url %}
        <img src="{{ post.image_url }}" class="card-img-top" alt="imagen post" loading="lazy"
             style="max-height: 200px; object-fit: cover;">
        {% endif %}

        <div class="card-body d-flex flex-column">
            <h5 class="card-title">
                {{ post.usuario.name if post.usuario else "Usuario desconocido" }}
            </h5>

            <p class="card-text flex-grow-1">{{ post.contenido }}</p>

            <p class="card-text mt-auto">
                <small class="text-body-secondary">
                    Post #{{ post.contador_post }}
                    {% if post.created_at %}
                        · {{ post.created_at.strftime("%Y-%m-%d %H:%M") }}
                    {% endif %}
                </small>
            </p>

            <div class="d-flex justify-content-between align-items-center mt-2">
                <button class="btn btn-sm btn-outline-primary btn-like"
                        data-id="{{ post.contador_post }}">
                    👍 <span class="likes-count">{{ post.likes_count or 0 }}</span>
                </button>

                <a href="/usuarios/{{ post.usuario.id if post.usuario else '#' }}"
                   class="btn btn-sm btn-outline-secondary">
                    Ver usuario
                </a>

                <a href="/posts/{{ post.contador_post }}/editar"
                   class="btn btn-sm btn-outline-warning">
                     Editar Post/  Borrar Post
                </a>
            </div>
        </div>
    </div>
</div>
