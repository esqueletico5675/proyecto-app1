<div class="col-12 col-md-6 mb-4">
    <div class="card text-bg-dark" style="min-height: 250px;">

        {% if post.image_url %}
        <img src="{{ post.image_url }}" class="card-img" alt="imagen post"
             style="height: 250px; object-fit: cover; opacity: 0.6;">
        {% else %}
        <div class="card-img bg-secondary" style="height: 250px;"></div>
        {% endif %}

        <div class="card-img-overlay d-flex flex-column justify-content-end">
            <h5 class="card-title fw-bold">
                {{ post.usuario.name if post.usuario else "Usuario desconocido" }}
            </h5>
            <p class="card-text">{{ post.contenido }}</p>
            <p class="card-text">
                <small>Post #{{ post.contador_post }}</small>
            </p>

            <div class="d-flex gap-2 mt-2">
                <form method="POST" action="/posts/{{ post.contador_post }}/like">
                    <button type="submit" class="btn btn-sm btn-light">
                        👍 {{ post.likes_count or 0 }}
                    </button>
                </form>
                <form method="POST" action="/posts/{{ post.contador_post }}/quitar-like">
                    <button type="submit" class="btn btn-sm btn-outline-light">
                        👎
                    </button>
                </form>
                <a href="/usuarios/{{ post.usuario.id if post.usuario else '#' }}"
                   class="btn btn-sm btn-outline-light">Ver usuario</a>
                <a href="/posts/{{ post.contador_post }}/editar"
                   class="btn btn-sm btn-warning">✏️ Editar</a>
            </div>
        </div>
    </div>
</div>
